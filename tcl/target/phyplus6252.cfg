# OpenOCD target config for PHYPLUS6252 (PB-03 module, Cortex-M0)

# Source helpers (optional, but recommended for SWD/JTAG and memory helpers)
source [find target/swj-dp.tcl]
source [find mem_helper.tcl]

# Set chip name
if { [info exists CHIPNAME] } {
    set _CHIPNAME $CHIPNAME
} else {
    set _CHIPNAME phyplus6252
}

# Set work area size (RAM)
if { [info exists WORKAREASIZE] } {
    set _WORKAREASIZE $WORKAREASIZE
} else {
    set _WORKAREASIZE 0x10000  ;# 64KB RAM
}

# Set TAP ID
if { [info exists CPUTAPID] } {
    set _CPUTAPID $CPUTAPID
} else {
    set _CPUTAPID 0x0bb11477   ;# Cortex-M0 DPIDR
}

# Select SWD transport before tap creation
transport select swd

# Use swj_newdap if available, else fallback to jtag newtap
if {[catch {swj_newdap $_CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id $_CPUTAPID}]} {
    jtag newtap $_CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id $_CPUTAPID
}
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -dap $_CHIPNAME.dap

$_TARGETNAME configure -work-area-phys 0x20000000 -work-area-size $_WORKAREASIZE -work-area-backup 0

# Flash bank definition: base, size, sector size, target
set _FLASHNAME $_CHIPNAME.flash
flash bank $_FLASHNAME phyplus6252 0x11000000 0x40000 0 0 $_TARGETNAME

# Adapter speed (adjust as needed)
adapter speed 1000

# Reset configuration (adjust if needed for your hardware)
reset_config srst_nogate

# Optionally, add event hooks for reset/init, watchdog disable, etc.
# Example:
# $_TARGETNAME configure -event reset-init { ... }
