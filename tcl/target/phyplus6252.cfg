# OpenOCD target config for PHYPLUS6252 (PB-03 module, Cortex-M0)
# Includes automatic flash unlock sequence based on boot ROM analysis

# Source helpers (optional, but recommended for SWD/JTAG and memory helpers)
source [find target/swj-dp.tcl]
source [find mem_helper.tcl]

# Set chip name
if { [info exists CHIPNAME] } {
    set _CHIPNAME $CHIPNAME
} else {
    set _CHIPNAME phyplus6252
}

# Set work area size (RAM available: 64KB total, reserve some for ROM functions)
if { [info exists WORKAREASIZE] } {
    set _WORKAREASIZE $WORKAREASIZE
} else {
    set _WORKAREASIZE 0x8000  ;# 32KB work area (conservative to avoid ROM buffer area)
}

# Set TAP ID
if { [info exists CPUTAPID] } {
    set _CPUTAPID $CPUTAPID
} else {
    set _CPUTAPID 0x0bb11477   ;# Cortex-M0 DPIDR
}

# Select SWD transport before tap creation
transport select swd

# Use swj_newdap if available, else fallback to jtag newtap
if {[catch {swj_newdap $_CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id $_CPUTAPID}]} {
    jtag newtap $_CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id $_CPUTAPID
}
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -dap $_CHIPNAME.dap

$_TARGETNAME configure -work-area-phys 0x20000000 -work-area-size $_WORKAREASIZE -work-area-backup 0

# Flash bank definition: base, size (will be auto-detected), sector size, target
set _FLASHNAME $_CHIPNAME.flash
flash bank $_FLASHNAME phyplus6252 0x11000000 0 0 0 $_TARGETNAME

# Adapter speed (adjust as needed, start conservative)
adapter speed 1000

# Reset configuration - use srst if available, otherwise software reset
reset_config srst_nogate

# Define addresses for flash unlock mechanism
set SRAM_OVERRIDE_ADDR  0x1FFF0801
set PCR_CACHE_BYPASS    0x4000F000

# Automatic flash unlock on reset-init
# This implements the boot ROM unlock sequence automatically
$_TARGETNAME configure -event reset-init {
    echo "PHYPLUS6252: Initializing and unlocking flash..."
    
    # Halt the processor
    halt
    
    # Wait for halt to complete
    sleep 100
    
    # Set SRAM override flag (must be exactly 1)
    echo "Setting SRAM override flag..."
    mwb $::SRAM_OVERRIDE_ADDR 0x01
    
    # Verify the flag was set
    set override_val [mrb $::SRAM_OVERRIDE_ADDR]
    if { $override_val != 1 } {
        echo "Warning: SRAM override flag verification failed"
    } else {
        echo "SRAM override flag set successfully"
    }
    
    # Enable cache bypass for direct hardware access
    mww $::PCR_CACHE_BYPASS 0x01
    
    # Perform soft reset to trigger boot ROM unlock sequence
    echo "Performing soft reset to unlock flash..."
    reset halt
    
    # Wait for reset to complete
    sleep 200
    
    # Re-enable cache bypass after reset
    mww $::PCR_CACHE_BYPASS 0x01
    
    echo "Flash unlock sequence completed"
}

# Event hook for examine-end (when target is first detected)
$_TARGETNAME configure -event examine-end {
    echo "PHYPLUS6252 target detected"
}

# Optional: Add event hook for flash probe
$_TARGETNAME configure -event gdb-attach {
    echo "GDB attached to PHYPLUS6252"
    # Flash will be automatically unlocked by reset-init if needed
}

# Helper procedures for manual flash operations
proc phyplus6252_manual_unlock {} {
    echo "Manually unlocking PHYPLUS6252 flash..."
    
    # Halt if running
    halt
    sleep 100
    
    # Set SRAM override
    mwb $::SRAM_OVERRIDE_ADDR 0x01
    
    # Verify
    set val [mrb $::SRAM_OVERRIDE_ADDR]
    if { $val == 1 } {
        echo "SRAM override set successfully"
    } else {
        echo "SRAM override failed: got $val, expected 1"
        return
    }
    
    # Enable cache bypass
    mww $::PCR_CACHE_BYPASS 0x01
    
    # Soft reset
    reset halt
    sleep 200
    
    # Re-enable cache bypass
    mww $::PCR_CACHE_BYPASS 0x01
    
    echo "Manual unlock completed"
}

proc phyplus6252_check_status {} {
    set iomux_gate [mrw 0x4000B014]
    set override_flag [mrb $::SRAM_OVERRIDE_ADDR]
    
    echo "Flash status check:"
    echo "  IOMUX gate (0x4000B014): 0x[format %08X $iomux_gate]"
    echo "  SRAM override (0x1FFF0801): 0x[format %02X $override_flag]"
    
    if { $iomux_gate == 0 } {
        echo "  Flash is LOCKED"
    } else {
        echo "  Flash is UNLOCKED"
    }
}
reset_config srst_nogate

# Optionally, add event hooks for reset/init, watchdog disable, etc.
# Example:
# $_TARGETNAME configure -event reset-init { ... }
